name: Generate Newsletter Images

# NOTE (2026-07-05): The Sunday cron was removed — it generated images from the
# PREVIOUS Monday's prompts (one week stale). Image generation now runs inside
# newsletter_pipeline.yml right after the draft. This workflow remains for manual
# runs and for pushes that edit prompts by hand (bot pushes via GITHUB_TOKEN
# do NOT trigger the push event — GitHub anti-recursion rule).
on:
  push:
    paths:
      - 'prompts/weekly_prompts.json'
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai pillow

      - name: Generate images from prompts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_images_action.py

      - name: Commit and push images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Fight Docket Bot"
          git config user.email "thefightdocket@gmail.com"
          git add assets/newsletter_images/ prompts/last_generated_images.json || true
          git diff --staged --quiet || git commit -m "Add newsletter images [$(date +%Y-%m-%d)]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
