name: Monday Twitter Thread

# Runs Monday 10am EDT (1400 UTC) — 2 hours after newsletter pipeline
# so the newsletter HTML is already committed before this runs.
on:
  schedule:
    - cron: '0 14 * * 1'  # Monday 2pm UTC = 10am EDT
  workflow_dispatch:

jobs:
  post-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy google-genai python-dotenv --break-system-packages

      - name: Post Twitter thread
        env:
          TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
        run: python post_twitter_thread.py

      - name: Commit updated social log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Fight Docket Bot"
          git config user.email "bot@thefightdocket.com"
          git add social-log.md || true
          git diff --staged --quiet || git commit -m "Twitter thread posted [$(date +%Y-%m-%d)]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || true
