name: Monday Newsletter Pipeline

on:
  schedule:
    - cron: '0 12 * * 1'  # Monday 8am EDT
  workflow_dispatch:

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv google-genai pillow playwright crawl4ai --break-system-packages
          playwright install chromium --with-deps

      - name: Run newsletter generator
        env:
          FIRECRAWL_API_KEY:  ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python newsletter_generator.py

      # Images are generated HERE, right after the draft, from THIS week's prompts.
      # (The old Sunday-cron generate_images.yml consumed week-old prompts because
      # GITHUB_TOKEN pushes never trigger other workflows' push events.)
      - name: Generate newsletter images from fresh prompts
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_images_action.py

      - name: Commit newsletter, prompts, images, and IG data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Fight Docket Bot"
          git config user.email "bot@thefightdocket.com"
          git add "newsletter_*.html" prompts/weekly_prompts.json prompts/weekly_ig_data.json assets/newsletter_images/ prompts/last_generated_images.json || true
          git diff --staged --quiet || git commit -m "Newsletter draft + prompts + images [$(date '+%Y-%m-%d')]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || true

      - name: Post to Beehiiv via browser
        continue-on-error: true
        env:
          BEEHIIV_EMAIL:          ${{ secrets.BEEHIIV_EMAIL }}
          BEEHIIV_PASSWORD:       ${{ secrets.BEEHIIV_PASSWORD }}
          BEEHIIV_SESSION:        ${{ secrets.BEEHIIV_SESSION }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          IMGBB_API_KEY:          ${{ secrets.IMGBB_API_KEY }}
        run: python beehiiv_browser_post.py
