name: Monday Newsletter Pipeline

# Runs Monday 8am EDT (1200 UTC) — after Sunday night results are committed.
# Generates newsletter covering the previous weekend's fights + upcoming card previews.
# Image prompts trigger generate_images.yml (Sunday 7:15pm EDT).
on:
  schedule:
    - cron: '0 12 * * 1'  # Monday noon UTC = 8am EDT
  workflow_dispatch:

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv google-genai --break-system-packages

      # Check if a previous newsletter failed to post — if so, skip regeneration
      - name: Check for unposted newsletter
        id: preflight
        run: |
          python - <<'EOF'
          import json, pathlib, os
          status_file = pathlib.Path("prompts/post_status.json")
          skip = False
          if status_file.exists():
              try:
                  d = json.loads(status_file.read_text())
                  if not d.get("posted", True) and d.get("newsletter_file"):
                      if pathlib.Path(d["newsletter_file"]).exists():
                          skip = True
                          print(f"Unposted newsletter found: {d['newsletter_file']} — skipping generation, retrying post")
              except Exception:
                  pass
          output_file = os.environ.get("GITHUB_OUTPUT", "")
          if output_file:
              with open(output_file, "a") as f:
                  f.write(f"skip_generation={'true' if skip else 'false'}\n")
          EOF

      - name: Run newsletter generator
        if: steps.preflight.outputs.skip_generation != 'true'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        run: python newsletter_generator.py

      - name: Commit newsletter draft, prompts, and IG data
        if: steps.preflight.outputs.skip_generation != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Fight Docket Bot"
          git config user.email "bot@thefightdocket.com"
          git add "newsletter_*.html" prompts/weekly_prompts.json prompts/weekly_ig_data.json || true
          git diff --staged --quiet || git commit -m "Newsletter draft + prompts [$(date +%Y-%m-%d)]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || true

      - name: Post to Beehiiv and schedule send
        env:
          BEEHIIV_API_KEY:        ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          IMGBB_API_KEY:          ${{ secrets.IMGBB_API_KEY }}
        run: python beehiiv_post.py

      - name: Commit post status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Fight Docket Bot" || true
          git config user.email "bot@thefightdocket.com" || true
          git add prompts/post_status.json || true
          git diff --staged --quiet || git commit -m "Update Beehiiv post status [$(date +%Y-%m-%d)]"
          git pull --rebase https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main || true
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || true
