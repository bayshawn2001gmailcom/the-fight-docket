name: Sunday Post Fight Results

# Sunday 6:00am EDT (10:00 UTC) final sweep — catches any results the
# Friday/Saturday night runs missed. Same script + dedup, so nothing
# double-posts. Replaces the old instagrapi 1am–4am sleep-loop design
# (instagrapi is blocked from GitHub Actions IPs; Graph API is not).
on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  post-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv google-genai tweepy pillow --break-system-packages

      - name: Final results sweep (post any missed results)
        env:
          FIRECRAWL_API_KEY:     ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          TWITTER_API_KEY:       ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:    ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:  ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_PAGE_TOKEN:  ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID:      ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN:   ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          IMGBB_API_KEY:         ${{ secrets.IMGBB_API_KEY }}
        run: python post_live_result.py

      - name: Commit results log and IG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Fight Docket Bot"
          git config user.email "bot@thefightdocket.com"
          git add posted_results.json instagram_content/ || true
          git diff --staged --quiet || git commit -m "Live results: Sunday sweep [$(date '+%Y-%m-%d %H:%M')]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || true
