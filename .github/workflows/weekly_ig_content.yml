name: Monday IG Content Generator

# Runs Monday 11am EDT (1500 UTC) — 3 hours after newsletter pipeline,
# reads weekly_ig_data.json produced by the Monday newsletter pipeline.
# DISABLED 2026-08-25: superseded by the on-demand /newsletter skill.
# Content is now researched, written and verified in-session when asked for,
# because the generated draft always required a fact-check pass anyway.
# workflow_dispatch is kept so this can still be fired by hand.
on:
  workflow_dispatch:

jobs:
  generate-ig-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow python-dotenv requests --break-system-packages

      - name: Generate IG graphics and captions
        run: python ig_content_generator.py

      - name: Commit IG content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Fight Docket Bot"
          git config user.email "bot@thefightdocket.com"
          git add instagram_content/ || true
          git diff --staged --quiet || git commit -m "IG content generated [$(date +%Y-%m-%d)]"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || true

      - name: Post Monday preview card (IG + FB)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID:     ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN:  ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          IMGBB_API_KEY:        ${{ secrets.IMGBB_API_KEY }}
        run: python post_instagram_weekly.py --card preview
