name: Friday IG Post — Quote Card

# Posts the weekly quote card to Instagram + Facebook.
# Card generated Monday 11am EDT by weekly_ig_content.yml.
on:
  schedule:
    - cron: '0 16 * * 5'  # Friday 4pm UTC = 12pm EDT
  workflow_dispatch:

jobs:
  post-quote-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv pillow --break-system-packages

      - name: Post quote card (IG + FB)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID:     ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN:  ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          IMGBB_API_KEY:        ${{ secrets.IMGBB_API_KEY }}
        run: python post_instagram_weekly.py --card quote
